databases:
  - name: cemps-db
    databaseName: cemps_db
    user: postgres
    region: oregon
    plan: free

services:
  - type: web
    name: cemps-web
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/seed.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cemps-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "*"
      - key: PROJECT_NAME
        value: "Community Event Management and Participation System (CEMPS)"
      - key: PYTHON_VERSION
        value: 3.11.9
