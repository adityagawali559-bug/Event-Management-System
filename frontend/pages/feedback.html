<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Feedback - CEMPS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="form-container">
            
            <div class="text-center mb-4">
              <div class="badge bg-success-subtle text-success p-3 rounded-circle fs-3 mb-2">
                <i class="bi bi-chat-heart"></i>
              </div>
              <h3 class="fw-bold mb-1">Share Your Event Feedback</h3>
              <p class="text-muted small" id="feedback-event-subtitle">Help organizers improve future community engagement drives</p>
            </div>

            <form id="feedback-form">
              <input type="hidden" id="event-id">

              <!-- Rating Selection 1-5 -->
              <div class="mb-4 text-center">
                <label class="form-label d-block mb-2">Overall Event Rating</label>
                <div class="btn-group" role="group" aria-label="Rating selector">
                  <input type="radio" class="btn-check" name="rating" id="star1" value="1" required>
                  <label class="btn btn-outline-warning" for="star1">1 ★</label>

                  <input type="radio" class="btn-check" name="rating" id="star2" value="2">
                  <label class="btn btn-outline-warning" for="star2">2 ★</label>

                  <input type="radio" class="btn-check" name="rating" id="star3" value="3">
                  <label class="btn btn-outline-warning" for="star3">3 ★</label>

                  <input type="radio" class="btn-check" name="rating" id="star4" value="4">
                  <label class="btn btn-outline-warning" for="star4">4 ★</label>

                  <input type="radio" class="btn-check" name="rating" id="star5" value="5" checked>
                  <label class="btn btn-outline-warning" for="star5">5 ★</label>
                </div>
              </div>

              <!-- Comment -->
              <div class="mb-4">
                <label for="comment" class="form-label">Your Comments / Experience</label>
                <textarea class="form-control" id="comment" rows="4" placeholder="How was the organization? What did you learn or accomplish during the session? Any suggestions for next time?"></textarea>
              </div>

              <div class="d-flex justify-content-between">
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
                <button type="submit" id="btn-submit-fb" class="btn btn-primary fw-bold px-4">
                  Submit Feedback
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNavbar();
      renderFooter();

      if (!auth.requireAuth()) return;

      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get("id");
      if (!eventId) {
        showToast("No event specified for feedback.", "danger");
        window.location.href = "my-registrations.html";
        return;
      }

      document.getElementById("event-id").value = eventId;

      try {
        const evt = await api.get(`/events/${eventId}`);
        document.getElementById("feedback-event-subtitle").textContent = `Feedback for: ${evt.title}`;
      } catch (err) {
        // Fallback
      }

      const form = document.getElementById("feedback-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const rating = parseInt(document.querySelector('input[name="rating"]:checked').value, 10);
        const comment = document.getElementById("comment").value.trim() || null;

        try {
          await api.post(`/events/${eventId}/feedback`, { rating, comment });
          showToast("Thank you! Your feedback has been submitted successfully.", "success");
          setTimeout(() => {
            window.location.href = `event-details.html?id=${eventId}`;
          }, 1000);
        } catch (err) {
          showToast(err.message, "danger");
        }
      });
    });
  </script>
</body>
</html>
