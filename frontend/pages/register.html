<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CEMPS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="form-container">
            <div class="text-center mb-4">
              <div class="badge bg-success-subtle text-success p-2 rounded-circle mb-2">
                <i class="bi bi-person-plus-fill fs-4"></i>
              </div>
              <h3 class="fw-bold">Create CEMPS Account</h3>
              <p class="text-muted small">Join your college and local community engagement network</p>
            </div>

            <form id="register-form">
              <div class="mb-3">
                <label for="full_name" class="form-label">Full Name <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="full_name" placeholder="Aarav Patel" minlength="2" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-7">
                  <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="student@college.edu" required>
                  </div>
                </div>
                <div class="col-md-5">
                  <label for="mobile" class="form-label">Mobile Number</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                    <input type="tel" class="form-control" id="mobile" placeholder="9876543210" pattern="[0-9]{10}">
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label for="role" class="form-label">Account Role</label>
                <select class="form-select" id="role">
                  <option value="participant" selected>Participant / Student (Default)</option>
                  <option value="organizer">Event Organizer (Club Lead / NGO)</option>
                </select>
                <div class="form-text small">Admin accounts are managed and authorized directly by college deans.</div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control" id="password" minlength="6" placeholder="Min 6 chars" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="confirm_password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control" id="confirm_password" minlength="6" placeholder="Re-enter password" required>
                  </div>
                </div>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" id="btn-submit" class="btn btn-primary fw-bold py-2">
                  <span id="btn-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                  Create Account
                </button>
              </div>

              <div class="text-center text-muted small">
                Already have an account? <a href="login.html" class="fw-semibold text-primary">Login here</a>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderNavbar("register");
      renderFooter();

      const form = document.getElementById("register-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const full_name = document.getElementById("full_name").value.trim();
        const email = document.getElementById("email").value.trim();
        const mobile = document.getElementById("mobile").value.trim() || null;
        const role = document.getElementById("role").value;
        const password = document.getElementById("password").value;
        const confirm_password = document.getElementById("confirm_password").value;

        if (password !== confirm_password) {
          showToast("Passwords do not match. Please re-enter.", "danger");
          return;
        }

        const btn = document.getElementById("btn-submit");
        const spinner = document.getElementById("btn-spinner");
        btn.disabled = true;
        spinner.classList.remove("d-none");

        try {
          await auth.register({
            full_name,
            email,
            mobile,
            role,
            password,
            confirm_password,
          });
        } catch (err) {
          btn.disabled = false;
          spinner.classList.add("d-none");
        }
      });
    });
  </script>
</body>
</html>
