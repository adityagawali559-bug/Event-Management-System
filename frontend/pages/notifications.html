<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - CEMPS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
              <h2 class="fw-bold mb-1">
                <i class="bi bi-bell text-primary me-2"></i> Notifications Center
              </h2>
              <p class="text-muted small">Real-time alerts for registrations, volunteer updates, and announcements</p>
            </div>
            <button class="btn btn-outline-primary btn-sm" onclick="notificationsModule.markAllAsRead()">
              <i class="bi bi-check2-all me-1"></i> Mark All as Read
            </button>
          </div>

          <div class="card card-custom p-4">
            <div id="notifications-list-container">
              <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/notifications.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderNavbar("notifications");
      renderFooter();
      notificationsModule.init();
    });
  </script>
</body>
</html>
