<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Registrations - CEMPS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">My Event Participation</h2>
          <p class="text-muted small">Manage your registered seats and volunteer commitments</p>
        </div>
        <a href="events.html" class="btn btn-outline-primary">
          <i class="bi bi-search me-1"></i> Browse More Events
        </a>
      </div>

      <!-- Navigation Tabs -->
      <ul class="nav nav-tabs mb-4" id="participationTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-bold" id="registrations-tab" data-bs-toggle="tab" data-bs-target="#registrations-pane" type="button" role="tab">
            <i class="bi bi-ticket-perforated me-1"></i> Event Registrations
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-bold" id="volunteers-tab" data-bs-toggle="tab" data-bs-target="#volunteers-pane" type="button" role="tab">
            <i class="bi bi-hand-thumbs-up me-1"></i> Volunteer Applications
          </button>
        </li>
      </ul>

      <div class="tab-content" id="participationTabsContent">
        <!-- Registrations Tab Pane -->
        <div class="tab-pane fade show active" id="registrations-pane" role="tabpanel">
          <div class="card card-custom p-4">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Event & Venue</th>
                    <th>Event Date</th>
                    <th>Registered On</th>
                    <th>My Status</th>
                    <th>Event Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="registrations-tbody">
                  <tr>
                    <td colspan="6" class="text-center py-4">
                      <div class="spinner-border spinner-border-sm text-primary"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Volunteers Tab Pane -->
        <div class="tab-pane fade" id="volunteers-pane" role="tabpanel">
          <div class="card card-custom p-4">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Event</th>
                    <th>Event Date</th>
                    <th>Applied Date</th>
                    <th>Application Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="volunteers-tbody">
                  <tr>
                    <td colspan="5" class="text-center py-4">
                      <div class="spinner-border spinner-border-sm text-success"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/registrations.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderNavbar("my-registrations");
      renderFooter();
      registrationsModule.init();
    });
  </script>
</body>
</html>
