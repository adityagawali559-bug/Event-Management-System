<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - CEMPS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="form-container">
            
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
              <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width: 64px; height: 64px; font-size: 2rem;">
                <i class="bi bi-person-fill"></i>
              </div>
              <div>
                <h3 class="fw-bold mb-1" id="profile-heading-name">User Profile</h3>
                <div class="d-flex gap-2 align-items-center">
                  <span id="profile-role-badge" class="badge-role participant">Participant</span>
                  <span class="text-muted small" id="profile-member-since">Member since 2026</span>
                </div>
              </div>
            </div>

            <form id="profile-form">
              <div class="mb-3">
                <label for="prof_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="prof_name" required>
              </div>

              <div class="mb-3">
                <label for="prof_email" class="form-label">Email Address</label>
                <input type="email" class="form-control bg-light" id="prof_email" disabled>
                <div class="form-text small">Email cannot be changed as it serves as your unique login ID.</div>
              </div>

              <div class="mb-4">
                <label for="prof_mobile" class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="prof_mobile" placeholder="9876543210">
              </div>

              <h6 class="fw-bold text-dark pt-2 mb-3">Security & Password</h6>

              <div class="mb-4">
                <label for="prof_password" class="form-label">New Password (leave blank to keep current)</label>
                <input type="password" class="form-control" id="prof_password" placeholder="••••••••" minlength="6">
              </div>

              <div class="d-flex justify-content-end gap-2">
                <button type="submit" id="btn-save-profile" class="btn btn-primary fw-bold px-4">
                  Save Changes
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNavbar("profile");
      renderFooter();

      if (!auth.requireAuth()) return;

      try {
        const user = await api.get("/users/me");
        document.getElementById("profile-heading-name").textContent = user.full_name;
        document.getElementById("prof_name").value = user.full_name;
        document.getElementById("prof_email").value = user.email;
        document.getElementById("prof_mobile").value = user.mobile || "";
        document.getElementById("profile-role-badge").className = `badge-role ${user.role}`;
        document.getElementById("profile-role-badge").textContent = user.role;
        document.getElementById("profile-member-since").textContent = `Joined ${formatDate(user.created_at)}`;
      } catch (err) {
        showToast("Error loading user profile.", "danger");
      }

      const form = document.getElementById("profile-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const full_name = document.getElementById("prof_name").value.trim();
        const mobile = document.getElementById("prof_mobile").value.trim() || null;
        const password = document.getElementById("prof_password").value || null;

        const payload = { full_name, mobile };
        if (password) payload.password = password;

        try {
          await auth.updateProfile(payload);
          document.getElementById("profile-heading-name").textContent = full_name;
          document.getElementById("prof_password").value = "";
          renderNavbar("profile");
        } catch (err) {
          // Toast handled in auth.updateProfile
        }
      });
    });
  </script>
</body>
</html>
