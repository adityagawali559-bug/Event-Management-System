<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CEMPS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="form-container">
            <div class="text-center mb-4">
              <div class="badge bg-primary-subtle text-primary p-2 rounded-circle mb-2">
                <i class="bi bi-box-arrow-in-right fs-4"></i>
              </div>
              <h3 class="fw-bold">Sign In to CEMPS</h3>
              <p class="text-muted small">Access your events, registrations, and dashboard</p>
            </div>

            <form id="login-form">
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="name@domain.com" required>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" id="btn-submit" class="btn btn-primary fw-bold py-2">
                  <span id="btn-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
                  Sign In
                </button>
              </div>

              <div class="text-center text-muted small">
                Don't have an account? <a href="register.html" class="fw-semibold text-primary">Register here</a>
              </div>
            </form>

            <hr class="my-4">

            <!-- Demo Quick-Fill Section for Viva / Evaluation -->
            <div class="bg-light p-3 rounded-3 border">
              <div class="small fw-bold text-secondary mb-2 d-flex align-items-center">
                <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Login (College Viva):
              </div>
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="fillDemo('admin@cemps.edu', 'Password123!')">
                  Admin
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="fillDemo('organizer@cemps.edu', 'Password123!')">
                  Organizer
                </button>
                <button type="button" class="btn btn-outline-success btn-sm" onclick="fillDemo('participant@cemps.edu', 'Password123!')">
                  Participant
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>

  <script>
    function fillDemo(email, pass) {
      document.getElementById("email").value = email;
      document.getElementById("password").value = pass;
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderNavbar("login");
      renderFooter();

      // If already logged in, redirect to dashboard
      if (auth.isLoggedIn()) {
        window.location.href = "dashboard.html";
        return;
      }

      const form = document.getElementById("login-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const btn = document.getElementById("btn-submit");
        const spinner = document.getElementById("btn-spinner");

        btn.disabled = true;
        spinner.classList.remove("d-none");

        try {
          await auth.login(email, password);
        } catch (err) {
          btn.disabled = false;
          spinner.classList.add("d-none");
        }
      });
    });
  </script>
</body>
</html>
